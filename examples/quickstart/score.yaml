# Quickstart: build this directory's Dockerfile on the cluster, run it, expose it over HTTPS, inject a Secret.
#
#   oc new-project quickstart
#   oc create secret generic web-secrets --from-literal=GREETING='hello from a Secret'
#   bin/score-ocp -p quickstart examples/quickstart/score.yaml
#   curl -k https://$(oc get route web-route -o jsonpath='{.spec.host}')/
apiVersion: score.dev/v1b1
metadata:
  name: web
containers:
  main:
    image: web:latest            # <workload>:latest = the image the build below produces
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi
    livenessProbe:
      httpGet:
        port: 8080
        path: /healthz
    readinessProbe:
      httpGet:
        port: 8080
        path: /ready
service:
  ports:
    http:
      port: 8080
resources:
  build:
    type: openshift-build        # ImageStream "web" + BuildConfig "web"; new builds roll the Deployment
  app-secrets:
    type: openshift-secret       # every key of Secret web-secrets becomes an env var (here: GREETING)
    params:
      name: web-secrets
  route:
    type: route                  # https://<assigned host>/ with edge TLS; http redirects to https
    params:
      port: http
