# Existing Secrets injected as environment variables. One envFrom per openshift-secret resource is added to every
# container and init container (patch 40-secret-envfrom). Secret values never pass through score-k8s.
#
#   oc new-project secrets-demo
#   oc create secret generic app-config --from-literal=GREETING=hi --from-literal=LOG_FORMAT=json
#   oc create secret generic db-creds   --from-literal=DB_PASSWORD=s3cret
#   bin/score-ocp -p secrets-demo examples/secrets/score.yaml
#   oc exec deploy/api -c worker -- printenv DB_PASSWORD     -> s3cret
#
# If a Secret is missing, the pod is not started: CreateContainerConfigError, secret "db-creds" not found.
apiVersion: score.dev/v1b1
metadata:
  name: api
containers:
  main:
    image: registry.access.redhat.com/ubi9/python-312:latest
    command: ["python", "/app/app.py"]
    files:
      /app/app.py:
        source: ../app/app.py
        noExpand: true
    variables:
      LOG_LEVEL: info            # plain variables still work alongside the Secrets
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
  worker:                        # second container: gets the same Secrets
    image: registry.access.redhat.com/ubi9/python-312:latest
    command: ["sleep", "infinity"]
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 64Mi
resources:
  app-config:
    type: openshift-secret
    params:
      name: app-config
  db:
    type: openshift-secret
    params:
      name: db-creds
