# Misspelled param: every provisioner rejects params it does not know.
# expect: unsupported param 'hostname'
apiVersion: score.dev/v1b1
metadata:
  name: typoparam
containers:
  main:
    image: registry.access.redhat.com/ubi9/python-312:latest
service:
  ports:
    http:
      port: 8080
resources:
  route:
    type: route
    params:
      port: http
      hostname: app.example.com
