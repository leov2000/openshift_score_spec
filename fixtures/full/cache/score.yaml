apiVersion: score.dev/v1b1
metadata:
  name: cache
  annotations:
    k8s.score.dev/kind: StatefulSet
containers:
  redis:
    image: registry.example.com/redis:7
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
    volumes:
      /data:
        source: ${resources.data}
service:
  ports:
    redis:
      port: 6379
resources:
  data:
    type: volume
    params:
      size: 2Gi
  creds:
    type: openshift-secret
    params:
      name: cache-secrets
