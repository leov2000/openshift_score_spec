apiVersion: score.dev/v1b1
metadata:
  name: web
  annotations:
    haproxy.router.openshift.io/timeout: 120s
    cert-manager.io/issuer-kind: ClusterIssuer
    cert-manager.io/issuer-name: corp-ca
    example.com/team: payments
containers:
  main:
    image: web:latest
    variables:
      CACHE_HOST: ${resources.cache.hostname}
      CACHE_PORT: ${resources.cache.port}
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi
    livenessProbe:
      httpGet:
        port: 8080
        path: /healthz
    readinessProbe:
      httpGet:
        port: 8080
        path: /ready
service:
  ports:
    http:
      port: 80
      targetPort: 8080
resources:
  build:
    type: openshift-build
    params:
      resources:
        limits:
          cpu: "2"
          memory: 2Gi
      secrets:
        - npmrc
      imageStreams:
        - name: ubi9-node
          tag: "20"
          from: registry.example.com/ubi9/nodejs-20:latest
  route:
    type: route
    params:
      host: web.apps.example.com
      path: /
      port: http
  app-secrets:
    type: openshift-secret
    params:
      name: web-secrets
  scaling:
    type: hpa
    params:
      minReplicas: 2
      maxReplicas: 6
  cache:
    type: service-port
    params:
      workload: cache
      port: redis
