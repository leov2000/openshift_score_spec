apiVersion: score.dev/v1b1
metadata:
  name: hello
containers:
  main:
    image: nginx:1.27
    variables:
      LOG_LEVEL: info
  worker:
    image: busybox:1.36
resources:
  app-secrets:
    type: openshift-secret
    params:
      name: hello-secrets
  db-creds:
    type: openshift-secret
    params:
      name: hello-db
